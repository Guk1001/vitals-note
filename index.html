<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>체온·혈압 노트</title>
<meta name="theme-color" content="#1d6a73" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f171c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column. "Now" card first (what to do right now, or when the next window is),
   then today's slots, the doctor summary, the record log, and settings at the bottom. */
:root{
  --bg:#edf1f3; --surface:#ffffff; --surface-2:#f6f8f9; --ink:#14222c; --muted:#5a6a76; --line:#d3dce2;
  --accent:#1d6a73; --accent-ink:#ffffff; --accent-soft:#dbeaec;
  --warn:#8f5300; --warn-soft:#fbeed6; --alert:#a22e28; --alert-soft:#f7e0dc; --ok:#2c6837; --ok-soft:#e1efe3;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f171c; --surface:#16212a; --surface-2:#1b2832; --ink:#e3ebef; --muted:#93a4b0; --line:#2a3943;
  --accent:#62b4bd; --accent-ink:#0b1a1d; --accent-soft:#1c3439;
  --warn:#e2a64c; --warn-soft:#33281a; --alert:#ef8b81; --alert-soft:#3b2220; --ok:#82c48e; --ok-soft:#1d3122;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f171c; --surface:#16212a; --surface-2:#1b2832; --ink:#e3ebef; --muted:#93a4b0; --line:#2a3943;
  --accent:#62b4bd; --accent-ink:#0b1a1d; --accent-soft:#1c3439;
  --warn:#e2a64c; --warn-soft:#33281a; --alert:#ef8b81; --alert-soft:#3b2220; --ok:#82c48e; --ok-soft:#1d3122;
  color-scheme:dark; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 48px)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wrap>section:empty,.wrap>div:empty{display:none}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.45rem;font-weight:700;letter-spacing:-0.01em}
h2{font-size:1.05rem;font-weight:600}
p{margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:0.86rem}
.label{font-size:0.75rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.phase{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:0.85rem}
.phase .dots{display:inline-flex;gap:3px}
.phase .dots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.25}
.phase .dots i.on{opacity:1}

.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:0.88rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.now{border-color:var(--accent);border-width:1.5px}
.now.rest{border-color:var(--line);border-width:1px}
.now-head{display:flex;flex-direction:column;gap:4px}
.now-title{font-size:1.25rem;font-weight:700}
.when{font-family:var(--font-num);font-size:1.05rem;color:var(--accent);font-weight:600}
.howto{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:0.9rem}

.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;
  padding:10px 16px;border-radius:10px;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink);font-weight:500}
.btn.link{background:none;border:none;color:var(--accent);padding:4px 0;min-height:0;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2);min-width:0}
.slot .st{font-size:0.8rem;font-weight:600}
.slot.done{background:var(--ok-soft);border-color:transparent}
.slot.done .st{color:var(--ok)}
.slot.open{border-color:var(--accent);background:var(--accent-soft)}
.slot.open .st{color:var(--accent)}
.slot.missed .st,.slot.later .st{color:var(--muted)}
.slot .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:0.88rem}

.med{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid var(--line)}

form{display:flex;flex-direction:column;gap:14px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{padding:0 6px;font-weight:600;font-size:0.9rem}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:0.8rem;color:var(--muted)}
input[type=number],input[type=time],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:1.05rem}
textarea{min-height:60px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:0.88rem;cursor:pointer}
.checks input{accent-color:var(--accent)}
.err{color:var(--alert);font-size:0.86rem}
.err:empty{display:none}

.msg{padding:12px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ink);font-size:0.92rem}
.msg.warn{background:var(--warn-soft)}
.msg.alert{background:var(--alert-soft)}

.log{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:none}
.day .d{font-weight:600;font-size:0.9rem}
.day .d small{display:block;font-weight:400;color:var(--muted);font-size:0.78rem}
.entries{display:flex;flex-direction:column;gap:3px;min-width:0}
.entry{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:0.88rem}
.entry .k{color:var(--muted);min-width:3.2em}
.entry .v{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.tag{font-size:0.75rem;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}

.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .big{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:600}
.stat .sub{font-size:0.8rem;color:var(--muted)}
pre.copy{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;font-family:var(--font-body);font-size:0.86rem}

details.card summary{cursor:pointer;font-weight:600;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"＋";float:right;color:var(--muted)}
details.card[open] summary::after{content:"－"}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.toggle{display:flex;gap:8px;align-items:flex-start;font-size:0.9rem}
.toggle input{margin-top:5px;accent-color:var(--accent)}
.notice{font-size:0.86rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.alarms{display:flex;flex-wrap:wrap;gap:6px}
.alarms span{font-family:var(--font-num);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:0.88rem;background:var(--surface-2)}
.sub-h{font-weight:600;font-size:0.92rem}
@media (prefers-reduced-motion:no-preference){ .card{transition:border-color .2s} }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <p class="label">하루 정해진 시간에만 재요</p>
      <h1>체온·혈압 노트</h1>
    </div>
    <span class="phase" id="phase">불러오는 중</span>
  </header>
  <div id="banner"></div>
  <section id="now"></section>
  <section id="today"></section>
  <section id="summary"></section>
  <section id="log"></section>
  <section id="settings"></section>
</div>

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
var STORE_KEY = "vitals-note-v1";
var BASE_DAYS = 7;
var DAY_START = 240; // 04:00 — 새벽 4시 전은 전날로 칩니다
var SESSIONS = {
  morning:{name:"아침", desc:"일어나서 1시간 안, 콘서타 먹기 전"},
  day:{name:"낮", desc:"콘서타 먹고 3~5시간 뒤"},
  evening:{name:"저녁", desc:"자기 전"},
  sick:{name:"아플 때", desc:"몸이 실제로 아플 때"}
};
var ORDER = ["morning","day","evening"];
var SYMPTOMS = ["기침","콧물·코막힘","목 아픔","몸살·근육통","오한","두통","설사·구토","기타"];
var WEEKDAYS = ["일","월","화","수","목","금","토"];
var DEFAULTS = {wake:"07:00", bed:"23:30", concerta:"08:00", trackDay:true, weeklyDay:0, nextVisit:"", startDate:""};

/* ---------- state ---------- */
var S = {ready:false, storageOk:true, settings:null, days:{}, form:null, flash:null};

/* ---------- utils ---------- */
function pad(n){return (n<10?"0":"")+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseYmd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(key,n){var d=parseYmd(key);d.setDate(d.getDate()+n);return ymd(d)}
function diffDays(a,b){var A=parseYmd(a),B=parseYmd(b);return Math.round((Date.UTC(A.getFullYear(),A.getMonth(),A.getDate())-Date.UTC(B.getFullYear(),B.getMonth(),B.getDate()))/864e5)}
function toMin(t){if(!t)return null;var p=t.split(":");return (+p[0])*60+(+p[1])}
function fmtMin(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)}
function nowLogical(){var d=new Date();var m=d.getHours()*60+d.getMinutes();if(m<DAY_START){d.setDate(d.getDate()-1);m+=1440}return {key:ymd(d),mins:m}}
function weekday(key){return parseYmd(key).getDay()}
function dateLabel(key){var d=parseYmd(key);return (d.getMonth()+1)+"월 "+d.getDate()+"일("+WEEKDAYS[d.getDay()]+")"}
function relLabel(key){var t=nowLogical().key;var n=diffDays(key,t);if(n===0)return "오늘";if(n===1)return "내일";if(n===-1)return "어제";return dateLabel(key)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o||{}))}
function avg(a){a=a.filter(function(x){return typeof x==="number"&&!isNaN(x)});if(!a.length)return null;return a.reduce(function(s,x){return s+x},0)/a.length}
function r0(x){return x==null?"–":String(Math.round(x))}
function r1(x){return x==null?"–":x.toFixed(1)}
function settings(){var s=clone(DEFAULTS);var cur=S.settings||{};for(var k in cur)s[k]=cur[k];return s}

/* windows in logical minutes of that day */
function windowFor(sess,st){
  if(sess==="morning"){var w=toMin(st.wake);return [w-30,w+90]}
  if(sess==="day"){var c=toMin(st.concerta);return [c+180,c+300]}
  if(sess==="evening"){var b=toMin(st.bed);if(b<DAY_START)b+=1440;return [b-90,b+30]}
  return null;
}
function phaseOf(key,st){
  if(!st.startDate)return {kind:"setup"};
  var i=diffDays(key,st.startDate);
  if(i<0)return {kind:"pending",day:i};
  if(i<BASE_DAYS)return {kind:"base",day:i};
  return {kind:"keep",day:i};
}
function scheduled(key,st){
  var ph=phaseOf(key,st);
  if(ph.kind==="base")return st.trackDay?["morning","day","evening"]:["morning","evening"];
  if(ph.kind==="keep"){
    if(st.nextVisit){var dv=diffDays(st.nextVisit,key);if(dv>=1&&dv<=3)return ["morning","evening"]}
    return weekday(key)===Number(st.weeklyDay)?["morning"]:[];
  }
  return [];
}
function entry(key,sess){var d=S.days[key];return d&&d.entries&&d.entries[sess]||null}

function findNow(){
  var st=settings(),n=nowLogical();
  for(var off=0;off<21;off++){
    var key=addDays(n.key,off);
    var list=scheduled(key,st);
    for(var i=0;i<ORDER.length;i++){
      var s=ORDER[i];if(list.indexOf(s)<0)continue;
      var w=windowFor(s,st);
      if(off===0){
        if(entry(key,s))continue;
        if(n.mins>w[1])continue;
        if(n.mins>=w[0])return {state:"open",key:key,sess:s,w:w};
      }
      return {state:"next",key:key,sess:s,w:w};
    }
  }
  return {state:"none"};
}

/* ---------- storage (이 휴대폰 안에만 저장) ---------- */
function load(){
  try{
    var raw=localStorage.getItem(STORE_KEY);
    if(raw){var o=JSON.parse(raw);S.settings=o.settings||null;S.days=o.days||{}}
  }catch(e){S.storageOk=false}
  S.ready=true;
}
function persist(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify({v:1,settings:S.settings,days:S.days}));S.storageOk=true}
  catch(e){S.storageOk=false;flash("alert","휴대폰에 저장하지 못했어요. 저장 공간이 부족하거나 브라우저가 저장을 막고 있어요.")}
}
function saveSettings(obj){S.settings=obj;persist();render()}
function saveDay(key,obj){obj.date=key;S.days[key]=obj;persist();render()}
function flash(kind,text){S.flash={kind:kind,text:text};render()}
function askPersistent(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}

function downloadFile(name,text,type){
  var blob=new Blob([text],{type:type});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1000);
}

/* ---------- render ---------- */
function $(id){return document.getElementById(id)}
function render(){renderPhase();renderBanner();renderNow();renderToday();renderSummary();renderLog();renderSettings()}

function renderPhase(){
  var el=$("phase");
  var st=settings(),n=nowLogical(),ph=phaseOf(n.key,st);
  if(ph.kind==="setup"){el.textContent="시작 전";return}
  if(ph.kind==="pending"){el.textContent=dateLabel(st.startDate)+" 시작";return}
  if(ph.kind==="base"){
    var dots="";for(var i=0;i<BASE_DAYS;i++)dots+='<i class="'+(i<=ph.day?"on":"")+'"></i>';
    el.innerHTML='기준 측정 '+(ph.day+1)+'/'+BASE_DAYS+'일 <span class="dots" aria-hidden="true">'+dots+'</span>';return;
  }
  el.textContent="유지 단계";
}
function renderBanner(){
  $("banner").innerHTML=S.storageOk?"":'<div class="banner">이 브라우저에서는 기록을 저장할 수 없어요. 시크릿 모드라면 일반 모드로 열어 주세요.</div>';
}

function howtoList(sess){
  if(sess==="sick")return '<ol class="howto"><li>겨드랑이 땀을 닦고 체온계를 깊이 넣어 팔을 꽉 붙이세요.</li><li>혈압은 원하면 같이 재도 되지만, 꼭 잴 필요는 없어요.</li></ol>';
  return '<ol class="howto"><li>화장실 다녀오고, 등을 기대고 앉아 5분 쉬세요. 카페인·담배는 30분 전부터 피하세요.</li>'+
    '<li>팔은 탁자에 올려 심장 높이로, 말하지 않고 재세요.</li>'+
    '<li>1~2분 뒤에 한 번 더 재서 두 번 다 적어요.</li>'+
    '<li>체온은 선택이에요. 하루 한두 번이면 충분해요.</li></ol>';
}

function renderNow(){
  var el=$("now");
  var st=settings();
  if(S.form){el.innerHTML=formHtml();bindForm();return}
  var flashHtml=S.flash?'<div class="msg '+(S.flash.kind==="ok"?"":S.flash.kind)+'">'+esc(S.flash.text)+'</div>':"";
  if(!st.startDate){
    el.innerHTML='<div class="card now"><div class="now-head"><p class="label">처음 한 번만</p><p class="now-title">7일 동안 기준 측정을 해요</p></div>'+
      '<p>하루 세 번(아침·낮·저녁), 정해진 시간에만 재요. 7일이 지나면 평균을 정리해서 진료 때 보여줄 요약을 만들어 드려요. 그 뒤로는 일주일에 한 번 아침에만 재면 돼요.</p>'+
      '<p class="notice">아래 <b>내 생활 시간</b>에서 기상·취침·콘서타 복용 시간을 먼저 맞춰 주세요. 측정 시간이 여기에 맞춰져요.</p>'+
      '<div class="row"><button class="btn" data-act="start-today">오늘부터 시작</button><button class="btn ghost" data-act="start-tomorrow">내일 아침부터 시작</button></div></div>';
    return;
  }
  var f=findNow();
  if(f.state==="open"){
    var s=SESSIONS[f.sess];
    el.innerHTML='<div class="card now"><div class="now-head"><p class="label">지금 잴 시간이에요</p><p class="now-title">'+s.name+' 측정</p>'+
      '<p class="when">'+fmtMin(f.w[0])+'–'+fmtMin(f.w[1])+'</p><p class="muted small">'+s.desc+'</p></div>'+howtoList(f.sess)+
      flashHtml+'<div class="row"><button class="btn" data-act="open-form" data-key="'+f.key+'" data-sess="'+f.sess+'">기록하기</button></div></div>';
    return;
  }
  var nextTxt;
  if(f.state==="next")nextTxt='<p class="label">다음 측정</p><p class="now-title">'+relLabel(f.key)+' '+SESSIONS[f.sess].name+'</p><p class="when">'+fmtMin(f.w[0])+'–'+fmtMin(f.w[1])+'</p>';
  else nextTxt='<p class="label">다음 측정</p><p class="now-title">예정된 측정이 없어요</p>';
  el.innerHTML='<div class="card now rest"><div class="now-head">'+nextTxt+'</div>'+flashHtml+
    '<p>지금은 재지 않아도 되는 시간이에요. 하나하나의 수치보다 <b>여러 날의 평균</b>이 중요해서, 정해진 시간 외에 더 재도 판단에 도움이 되지 않아요.</p>'+
    '<div class="row"><button class="btn quiet" data-act="open-form" data-key="'+nowLogical().key+'" data-sess="sick">몸이 실제로 아파요 · 증상과 체온 기록</button></div></div>';
}

function bpPair(e){return {s:avg([e.s1,e.s2]),d:avg([e.d1,e.d2]),p:avg([e.p1,e.p2])}}
function bpText(e){var b=bpPair(e);if(b.s==null)return "혈압 없음";return r0(b.s)+"/"+r0(b.d)+(b.p!=null?" · 맥박 "+r0(b.p):"")}

function slotHtml(key,sess,st,n){
  var w=windowFor(sess,st),e=entry(key,sess),cls="later",stTxt=fmtMin(w[0])+"부터",v="";
  if(e){cls="done";stTxt="완료";v=bpText(e)+(e.temp!=null?" · "+e.temp.toFixed(1)+"℃":"")}
  else if(key===n.key&&n.mins>=w[0]&&n.mins<=w[1]){cls="open";stTxt="지금 잴 시간"}
  else if(key===n.key&&n.mins>w[1]){cls="missed";stTxt="지나감 · 괜찮아요"}
  var edit=e&&key===n.key?' <button class="btn link small" data-act="open-form" data-key="'+key+'" data-sess="'+sess+'">고치기</button>':"";
  return '<div class="slot '+cls+'"><span class="st">'+stTxt+'</span><b>'+SESSIONS[sess].name+'</b><span class="muted small">'+fmtMin(w[0])+'–'+fmtMin(w[1])+'</span>'+(v?'<span class="v">'+v+'</span>':"")+edit+'</div>';
}
function renderToday(){
  var el=$("today");
  if(!settings().startDate){el.innerHTML="";return}
  var st=settings(),n=nowLogical(),list=scheduled(n.key,st),d=S.days[n.key]||{};
  var slots=list.length?'<div class="slots">'+list.map(function(s){return slotHtml(n.key,s,st,n)}).join("")+'</div>':'<p class="muted">오늘은 측정하는 날이 아니에요. 그냥 평소처럼 지내세요.</p>';
  var med=d.concertaAt?'<span>오늘 콘서타 <b class="num">'+esc(d.concertaAt)+'</b> 복용</span><button class="btn link small" data-act="med-undo">취소</button>':
    '<span class="muted">오늘 콘서타 복용 시각을 남겨두면 약 영향을 보기 쉬워요.</span><button class="btn ghost" data-act="med-now">지금 먹었어요</button>';
  var sick=(d.entries&&d.entries.sick)||[];
  var sickTxt=sick.length?'<p class="small muted">오늘 아플 때 기록 '+sick.length+'건</p>':"";
  el.innerHTML='<div class="card"><h2>오늘 · '+dateLabel(n.key)+'</h2>'+slots+sickTxt+'<div class="med">'+med+'</div></div>';
}

/* ---------- form ---------- */
function formHtml(){
  var f=S.form,s=SESSIONS[f.sess],e=f.sess==="sick"?{}:(entry(f.key,f.sess)||{});
  function num(id,ph,val,step){return '<div class="field"><label for="'+id+'">'+ph+'</label><input type="number" inputmode="decimal" id="'+id+'" '+(step?'step="'+step+'"':'')+' value="'+(val==null?"":val)+'"></div>'}
  var bp='<fieldset><legend>1번째</legend><div class="trio">'+num("s1","수축기(위)",e.s1)+num("d1","이완기(아래)",e.d1)+num("p1","맥박",e.p1)+'</div></fieldset>'+
         '<fieldset><legend>2번째 · 1~2분 뒤</legend><div class="trio">'+num("s2","수축기(위)",e.s2)+num("d2","이완기(아래)",e.d2)+num("p2","맥박",e.p2)+'</div></fieldset>';
  var temp='<div class="field"><label for="temp">체온 ℃'+(f.sess==="sick"?"":" (선택)")+'</label><input type="number" inputmode="decimal" step="0.1" id="temp" value="'+(e.temp==null?"":e.temp)+'"></div>';
  var sym="";
  if(f.sess==="sick")sym='<fieldset><legend>어떤 증상이 있나요?</legend><div class="checks">'+SYMPTOMS.map(function(x,i){return '<label><input type="checkbox" name="sym" value="'+x+'" id="sym'+i+'">'+x+'</label>'}).join("")+'</div></fieldset>';
  var bpBlock=f.sess!=="sick"?bp:'<details><summary class="small muted" style="cursor:pointer">혈압도 같이 적기 (선택)</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">'+bp+'</div></details>';
  return '<div class="card now"><div class="now-head"><p class="label">'+relLabel(f.key)+' · '+s.desc+'</p><p class="now-title">'+s.name+' 기록</p></div>'+
    '<form id="entry-form" novalidate>'+(f.sess==="sick"?temp+sym+bpBlock:bpBlock+temp)+
    '<div class="field"><label for="note">메모 (선택)</label><textarea id="note" placeholder="예: 커피 마신 지 1시간, 잠을 설침">'+esc(e.note||"")+'</textarea></div>'+
    '<p class="err" id="form-err" role="alert"></p>'+
    '<div class="row"><button class="btn" type="submit">저장</button><button class="btn quiet" type="button" data-act="close-form">취소</button></div></form></div>';
}
function bindForm(){
  var form=$("entry-form");if(!form)return;
  form.addEventListener("submit",function(ev){ev.preventDefault();submitForm()});
}
function val(id){var el=$(id);if(!el||el.value==="")return null;var v=parseFloat(el.value);return isNaN(v)?NaN:v}
function submitForm(){
  var f=S.form,err=$("form-err");
  var o={s1:val("s1"),d1:val("d1"),p1:val("p1"),s2:val("s2"),d2:val("d2"),p2:val("p2"),temp:val("temp")};
  var note=($("note")||{}).value||"";
  function bad(x,lo,hi){return x!=null&&(isNaN(x)||x<lo||x>hi)}
  if(bad(o.s1,60,260)||bad(o.s2,60,260))return err.textContent="수축기(위) 숫자를 확인해 주세요. 보통 60~260 사이예요.";
  if(bad(o.d1,30,160)||bad(o.d2,30,160))return err.textContent="이완기(아래) 숫자를 확인해 주세요. 보통 30~160 사이예요.";
  if(bad(o.p1,30,220)||bad(o.p2,30,220))return err.textContent="맥박 숫자를 확인해 주세요. 보통 30~220 사이예요.";
  if(bad(o.temp,34,42.5))return err.textContent="체온은 34~42.5℃ 사이로 적어 주세요.";
  if((o.s1==null)!==(o.d1==null)||(o.s2==null)!==(o.d2==null))return err.textContent="수축기와 이완기는 짝으로 적어 주세요.";
  if(o.s1!=null&&o.d1>=o.s1)return err.textContent="1번째 값에서 아래 숫자가 위 숫자보다 커요. 순서를 확인해 주세요.";
  if(o.s2!=null&&o.d2>=o.s2)return err.textContent="2번째 값에서 아래 숫자가 위 숫자보다 커요. 순서를 확인해 주세요.";
  var hasBp=o.s1!=null||o.s2!=null;
  if(f.sess!=="sick"&&!hasBp)return err.textContent="혈압을 한 번 이상 적어 주세요.";
  if(f.sess==="sick"&&o.temp==null)return err.textContent="체온을 적어 주세요.";
  var rec={at:new Date().toISOString()};
  for(var k in o)if(o[k]!=null)rec[k]=o[k];
  if(note.trim())rec.note=note.trim().slice(0,500);
  var day=clone(S.days[f.key]||{});day.entries=day.entries||{};
  if(f.sess==="sick"){
    rec.symptoms=[].slice.call(document.querySelectorAll('input[name=sym]:checked')).map(function(x){return x.value});
    day.entries.sick=(day.entries.sick||[]).concat([rec]);
  } else day.entries[f.sess]=rec;
  S.form=null;
  S.days[f.key]=day; // afterMessage가 최신 상태로 다음 측정을 계산하도록 먼저 반영
  S.flash=afterMessage(f.sess,rec);
  saveDay(f.key,day);
  window.scrollTo({top:0,behavior:"smooth"});
}
function afterMessage(sess,rec){
  if(sess==="sick"){
    var t=rec.temp;
    if(t>=39)return {kind:"alert",text:"체온이 "+t.toFixed(1)+"℃로 높아요. 물을 충분히 마시고 해열제를 고려하세요. 숨쉬기 힘들거나, 가슴이 아프거나, 의식이 흐리거나, 고열이 이틀 넘게 가면 바로 진료를 받으세요."};
    if(t>=38)return {kind:"warn",text:"체온이 "+t.toFixed(1)+"℃로 열이 있어요. 쉬면서 물을 충분히 마시세요. 3일 넘게 가거나 증상이 심해지면 진료를 받으세요. 다시 잴 때는 4~6시간 간격이면 충분해요."};
    if(t>=37.5)return {kind:"ok",text:"체온이 "+t.toFixed(1)+"℃로 미열 정도예요. 오늘은 푹 쉬고, 다시 잰다면 저녁에 한 번이면 충분해요."};
    return {kind:"ok",text:"체온이 "+t.toFixed(1)+"℃로 정상 범위예요. 몸이 불편한 건 체온과 별개로 쉬면서 지켜보세요."};
  }
  var b=bpPair(rec);
  if(b.s!=null&&(b.s>=180||b.d>=110))return {kind:"warn",text:"기록했어요. 이번 값이 꽤 높게 나왔어요. 10분 쉬고 한 번만 다시 재 보세요. 다시 재도 180/110 이상이고 두통·가슴 통증·시야 이상이 있으면 바로 진료를 받으세요. 증상이 없으면 다음 진료 때 말씀드리면 돼요."};
  var f=findNow();
  var nx=(f.state==="next"||f.state==="open")?(relLabel(f.key)+" "+SESSIONS[f.sess].name+" "+fmtMin(f.w[0])+"부터"):"아직 예정 없음";
  return {kind:"ok",text:"기록했어요. 다음 측정은 "+nx+"예요. 그 전까지는 다시 재지 않아도 돼요."};
}

/* ---------- summary ---------- */
function baselineKeys(st){var out=[];if(!st.startDate)return out;for(var i=0;i<BASE_DAYS;i++)out.push(addDays(st.startDate,i));return out}
function computeSummary(st){
  var keys=baselineKeys(st),g={morning:[],day:[],evening:[]},temps={morning:[],day:[],evening:[]},allT=[],med=[],count=0,daysWith=0;
  keys.forEach(function(k){
    var d=S.days[k];if(!d)return;var any=false;
    ORDER.forEach(function(s){var e=d.entries&&d.entries[s];if(!e)return;any=true;count++;var b=bpPair(e);if(b.s!=null)g[s].push(b);if(e.temp!=null){temps[s].push(e.temp);allT.push(e.temp)}});
    if(any)daysWith++;
    if(d.concertaAt)med.push(toMin(d.concertaAt));
  });
  function agg(list){return {n:list.length,s:avg(list.map(function(b){return b.s})),d:avg(list.map(function(b){return b.d})),p:avg(list.map(function(b){return b.p}))}}
  return {keys:keys,count:count,daysWith:daysWith,morning:agg(g.morning),day:agg(g.day),evening:agg(g.evening),home:agg(g.morning.concat(g.evening)),
    tm:avg(temps.morning),td:avg(temps.day),te:avg(temps.evening),tmax:allT.length?Math.max.apply(null,allT):null,
    med:avg(med),medDays:med.length};
}
function summaryText(st,m){
  var L=[];
  L.push("[가정 측정 요약] "+m.keys[0]+" ~ "+m.keys[m.keys.length-1]+" ("+m.daysWith+"일 기록, 측정 "+m.count+"회)");
  L.push("혈압 평균(아침·저녁): "+r0(m.home.s)+"/"+r0(m.home.d)+" mmHg, 맥박 "+r0(m.home.p));
  L.push("- 아침(기상 후·복용 전): "+r0(m.morning.s)+"/"+r0(m.morning.d)+", 맥박 "+r0(m.morning.p)+" ("+m.morning.n+"회)");
  if(st.trackDay)L.push("- 낮(콘서타 복용 3~5시간 후): "+r0(m.day.s)+"/"+r0(m.day.d)+", 맥박 "+r0(m.day.p)+" ("+m.day.n+"회)");
  L.push("- 저녁(취침 전): "+r0(m.evening.s)+"/"+r0(m.evening.d)+", 맥박 "+r0(m.evening.p)+" ("+m.evening.n+"회)");
  L.push("체온(겨드랑이) 평균: 아침 "+r1(m.tm)+"℃"+(st.trackDay?" / 낮 "+r1(m.td)+"℃":"")+" / 저녁 "+r1(m.te)+"℃, 최고 "+r1(m.tmax)+"℃");
  L.push("콘서타 복용 시각: "+(m.med!=null?"평균 "+fmtMin(Math.round(m.med))+" ("+m.medDays+"일 기록)":"기록 없음"));
  L.push("※ 각 측정은 5분 휴식 후 2회 측정한 값의 평균");
  return L.join("\n");
}
function renderSummary(){
  var el=$("summary"),st=settings();
  if(!st.startDate){el.innerHTML="";return}
  var n=nowLogical(),ph=phaseOf(n.key,st);
  if(ph.kind!=="keep"){
    var m0=computeSummary(st);
    el.innerHTML='<div class="card"><h2>진료용 요약</h2><p>기준 측정이 끝나는 <b>'+dateLabel(addDays(st.startDate,BASE_DAYS))+'</b>에 평균과 요약이 열려요. 지금까지 <b class="num">'+m0.count+'</b>회 기록했어요.</p>'+
      '<p class="notice">중간 평균은 일부러 보여드리지 않아요. 며칠치 값은 하루하루 크게 오르내려서, 7일을 다 모아야 믿을 만한 숫자가 돼요.</p></div>';
    return;
  }
  var m=computeSummary(st),verdict,vk;
  if(m.home.s==null){verdict="기준 측정 기간의 혈압 기록이 없어요. 설정에서 기준 측정을 다시 시작할 수 있어요.";vk="warn"}
  else if(m.home.s>=135||m.home.d>=85){verdict="가정혈압 평균이 기준(135/85)보다 높아요. 급한 상황은 아니에요. 이 요약을 다음 진료 때 보여주고 상의하세요.";vk="warn"}
  else {verdict="가정혈압 평균이 정상 범위(135/85 미만)예요.";vk="ok"}
  var extra=[];
  if(st.trackDay&&m.day.s!=null&&m.morning.s!=null&&m.day.s-m.morning.s>=10)extra.push("낮(약효 시간) 혈압이 아침보다 평균 "+r0(m.day.s-m.morning.s)+" 높아요. 콘서타 영향일 수 있으니 진료 때 이야기해 보세요.");
  if(m.home.p!=null&&m.home.p>=100)extra.push("쉬는 상태의 맥박 평균이 100 이상이에요. 진료 때 꼭 말씀드리세요.");
  if(m.tmax!=null&&m.tmax>=37.5)extra.push("기간 중 37.5℃ 이상이 있었어요. 기록을 진료 때 같이 보여주세요.");
  else if(m.tmax!=null)extra.push("체온은 모두 37.5℃ 미만으로 미열 기준 아래였어요.");
  function stat(t,b,show){return show?'<div class="stat"><span class="label">'+t+'</span><span class="big">'+r0(b.s)+'/'+r0(b.d)+'</span><span class="sub">맥박 '+r0(b.p)+' · '+b.n+'회</span></div>':""}
  var txt=summaryText(st,m);
  el.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><h2>진료용 요약</h2><span class="tag">'+dateLabel(m.keys[0])+' – '+dateLabel(m.keys[6])+'</span></div>'+
    '<div class="msg '+(vk==="ok"?"":vk)+'">'+verdict+'</div>'+
    '<div class="sumgrid">'+stat("아침·저녁 평균",m.home,true)+stat("아침",m.morning,true)+stat("낮 · 약효",m.day,st.trackDay)+stat("저녁",m.evening,true)+'</div>'+
    (extra.length?'<ul class="howto" style="color:var(--ink)">'+extra.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>':"")+
    '<pre class="copy" id="sumtext">'+esc(txt)+'</pre>'+
    '<div class="row"><button class="btn" data-act="copy">요약 복사</button><button class="btn ghost" data-act="csv">전체 기록 CSV 저장</button><span class="small muted" id="copy-msg" role="status"></span></div>'+
    '<p class="notice">다음 진료일을 설정에 넣어두면 진료 3일 전부터 아침·저녁 측정이 다시 잡혀요. 그 외에는 일주일에 한 번 '+WEEKDAYS[st.weeklyDay]+'요일 아침만 재요.</p></div>';
}

/* ---------- log ---------- */
function renderLog(){
  var el=$("log");
  var keys=Object.keys(S.days).filter(function(k){var d=S.days[k];return d&&d.entries&&Object.keys(d.entries).length}).sort().reverse();
  if(!keys.length){el.innerHTML='<div class="card"><h2>기록</h2><p class="muted">아직 기록이 없어요. 첫 측정 시간이 되면 위에 <b>기록하기</b> 버튼이 나타나요.</p></div>';return}
  var shown=S.showAll?keys:keys.slice(0,10);
  var rows=shown.map(function(k){
    var d=S.days[k],e=d.entries||{},lines=[];
    ORDER.forEach(function(s){var x=e[s];if(!x)return;lines.push('<div class="entry"><span class="k">'+SESSIONS[s].name+'</span><span class="v">'+bpText(x)+(x.temp!=null?" · "+x.temp.toFixed(1)+"℃":"")+'</span>'+(x.note?'<span class="muted small">'+esc(x.note)+'</span>':"")+'</div>')});
    (e.sick||[]).forEach(function(x){var t=new Date(x.at);lines.push('<div class="entry"><span class="k">아플 때</span><span class="v">'+(x.temp!=null?x.temp.toFixed(1)+"℃":"")+(x.s1!=null?" · "+bpText(x):"")+'</span><span class="muted small">'+pad(t.getHours())+":"+pad(t.getMinutes())+(x.symptoms&&x.symptoms.length?" · "+esc(x.symptoms.join(", ")):"")+(x.note?" · "+esc(x.note):"")+'</span></div>')});
    var ph=phaseOf(k,settings());
    return '<div class="day"><div class="d">'+dateLabel(k).replace(/\(.*/,"")+'<small>'+WEEKDAYS[weekday(k)]+'요일'+(d.concertaAt?' · 복용 '+esc(d.concertaAt):'')+'</small>'+(ph.kind==="base"?'<small>기준 '+(ph.day+1)+'일째</small>':'')+'</div><div class="entries">'+lines.join("")+'</div></div>';
  }).join("");
  el.innerHTML='<div class="card"><h2>기록</h2><div class="log">'+rows+'</div>'+(keys.length>10&&!S.showAll?'<button class="btn link" data-act="show-all">이전 기록 '+(keys.length-10)+'일 더 보기</button>':"")+'</div>';
}

/* ---------- settings ---------- */
function alarmTimes(st){
  var out=[["아침",windowFor("morning",st)[0]]];
  if(st.trackDay)out.push(["낮",windowFor("day",st)[0]]);
  out.push(["저녁",windowFor("evening",st)[0]]);
  return out.map(function(x){return '<span>'+x[0]+' '+fmtMin(x[1]+10)+'</span>'}).join("");
}
function renderSettings(){
  var el=$("settings");
  var sd=$("set-details");if(sd&&sd.contains(document.activeElement)&&sd.querySelector("form").contains(document.activeElement))return;
  var st=settings(),open=!st.startDate||S.settingsOpen;
  var wd=WEEKDAYS.map(function(w,i){return '<option value="'+i+'"'+(Number(st.weeklyDay)===i?" selected":"")+'>'+w+'요일</option>'}).join("");
  el.innerHTML='<details class="card" id="set-details"'+(open?" open":"")+'><summary>내 생활 시간 · 설정</summary>'+
    '<form id="set-form" novalidate><div class="grid2">'+
    '<div class="field"><label for="set-wake">보통 일어나는 시간</label><input type="time" id="set-wake" value="'+st.wake+'"></div>'+
    '<div class="field"><label for="set-bed">보통 자는 시간</label><input type="time" id="set-bed" value="'+st.bed+'"></div>'+
    '<div class="field"><label for="set-con">콘서타 먹는 시간</label><input type="time" id="set-con" value="'+st.concerta+'"></div>'+
    '<div class="field"><label for="set-week">유지 단계 측정 요일</label><select id="set-week">'+wd+'</select></div>'+
    '<div class="field"><label for="set-visit">다음 진료일 (선택)</label><input type="date" id="set-visit" value="'+(st.nextVisit||"")+'"></div>'+
    '</div><label class="toggle"><input type="checkbox" id="set-day"'+(st.trackDay?" checked":"")+'><span>기준 측정 때 낮(콘서타 약효 시간)에도 재기<br><span class="muted small">콘서타가 혈압·맥박에 주는 영향을 보려는 측정이에요. 하루 측정을 두 번으로 줄이고 싶으면 끄세요.</span></span></label>'+
    '<div class="row"><button class="btn" type="submit">설정 저장</button><span class="small muted" id="set-msg" role="status"></span></div></form>'+
    '<div class="med" style="flex-direction:column;align-items:flex-start"><p class="sub-h">휴대폰 알람 맞춰 둘 시간</p><div class="alarms">'+alarmTimes(st)+'</div>'+
    '<p class="small muted">시계 앱에 이 시간으로 반복 알람을 맞춰 두세요. 기준 측정 7일이 끝나면 알람은 꺼도 돼요.</p></div>'+
    '<div class="med" style="flex-direction:column;align-items:flex-start"><p class="sub-h">백업</p>'+
    '<p class="small muted">기록은 이 휴대폰 안에만 저장돼요. 휴대폰을 바꾸거나 브라우저 데이터를 지우기 전에 백업 파일을 저장해 두세요.</p>'+
    '<div class="row"><button class="btn quiet" data-act="backup">백업 파일 저장</button><label class="btn quiet" for="restore-file" style="display:inline-flex;align-items:center">백업 불러오기</label><input type="file" id="restore-file" accept="application/json,.json" hidden></div>'+
    '<p class="small" id="backup-msg" role="status"></p></div>'+
    (st.startDate?'<div class="med"><span class="small muted">기준 측정 시작일 '+dateLabel(st.startDate)+'</span>'+(S.confirmReset?'<span class="row"><span class="small">기존 기록은 남고, 오늘부터 7일을 새로 재요.</span><button class="btn" data-act="reset-yes">다시 시작</button><button class="btn quiet" data-act="reset-no">그만두기</button></span>':'<button class="btn link" data-act="reset">기준 측정 다시 시작</button>')+'</div>':'')+
    '</details>';
  $("set-form").addEventListener("submit",function(ev){
    ev.preventDefault();
    var o=clone(settings());
    o.wake=$("set-wake").value||DEFAULTS.wake;o.bed=$("set-bed").value||DEFAULTS.bed;o.concerta=$("set-con").value||DEFAULTS.concerta;
    o.weeklyDay=Number($("set-week").value);o.nextVisit=$("set-visit").value||"";o.trackDay=$("set-day").checked;
    S.settingsOpen=true;document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
    saveSettings(o);var m=$("set-msg");if(m)m.textContent="저장했어요.";
  });
  $("set-details").addEventListener("toggle",function(e){S.settingsOpen=e.target.open});
  $("restore-file").addEventListener("change",restoreBackup);
}

/* ---------- actions ---------- */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act"),n=nowLogical();
  if(a==="start-today"||a==="start-tomorrow"){var o=clone(settings());o.startDate=a==="start-today"?n.key:addDays(n.key,1);S.flash=null;askPersistent();saveSettings(o);window.scrollTo({top:0,behavior:"smooth"})}
  else if(a==="open-form"){S.form={key:b.getAttribute("data-key"),sess:b.getAttribute("data-sess")};S.flash=null;render();$("now").scrollIntoView({block:"start",behavior:"smooth"})}
  else if(a==="close-form"){S.form=null;render()}
  else if(a==="med-now"){var d=clone(S.days[n.key]||{});var t=new Date();d.concertaAt=pad(t.getHours())+":"+pad(t.getMinutes());saveDay(n.key,d)}
  else if(a==="med-undo"){var d2=clone(S.days[n.key]||{});delete d2.concertaAt;saveDay(n.key,d2)}
  else if(a==="show-all"){S.showAll=true;renderLog()}
  else if(a==="reset"){S.confirmReset=true;S.settingsOpen=true;renderSettings()}
  else if(a==="reset-no"){S.confirmReset=false;renderSettings()}
  else if(a==="reset-yes"){S.confirmReset=false;var o2=clone(settings());o2.startDate=n.key;saveSettings(o2)}
  else if(a==="copy"){copySummary()}
  else if(a==="csv"){saveCsv()}
  else if(a==="backup"){downloadFile("체온혈압노트_백업_"+n.key+".json",JSON.stringify({app:"vitals-note",v:1,exportedAt:new Date().toISOString(),settings:S.settings,days:S.days},null,1),"application/json");var bm=$("backup-msg");if(bm)bm.textContent="백업 파일을 저장했어요. 다운로드 폴더를 확인하세요."}
});
function restoreBackup(ev){
  var file=ev.target.files&&ev.target.files[0],msg=$("backup-msg");if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||o.app!=="vitals-note"||typeof o.days!=="object")throw new Error("format");
      var added=0;
      for(var k in o.days){if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;if(!S.days[k])added++;S.days[k]=o.days[k]}
      if(o.settings&&!S.settings)S.settings=o.settings;
      persist();render();
      var m2=$("backup-msg");if(m2)m2.textContent="불러왔어요. 새로 추가된 날 "+added+"일.";
    }catch(e){if(msg)msg.textContent="이 앱의 백업 파일이 아니에요. '체온혈압노트_백업'으로 시작하는 파일을 골라 주세요."}
  };
  r.readAsText(file);
}
function copySummary(){
  var txt=$("sumtext").textContent,msg=$("copy-msg");
  function fallback(){var r=document.createRange();r.selectNodeContents($("sumtext"));var s=window.getSelection();s.removeAllRanges();s.addRange(r);msg.textContent="선택해 두었어요. 길게 눌러 복사해 주세요."}
  try{navigator.clipboard.writeText(txt).then(function(){msg.textContent="복사했어요."},fallback)}catch(e){fallback()}
}
function csvCell(v){v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function saveCsv(){
  var rows=[["날짜","구분","기록시각","수축기1","이완기1","맥박1","수축기2","이완기2","맥박2","체온","콘서타복용","증상","메모"]];
  Object.keys(S.days).sort().forEach(function(k){
    var d=S.days[k],e=d.entries||{};
    function push(s,x){var t=new Date(x.at);rows.push([k,SESSIONS[s].name,pad(t.getHours())+":"+pad(t.getMinutes()),x.s1,x.d1,x.p1,x.s2,x.d2,x.p2,x.temp,d.concertaAt||"",(x.symptoms||[]).join("/"),x.note||""])}
    ORDER.forEach(function(s){if(e[s])push(s,e[s])});(e.sick||[]).forEach(function(x){push("sick",x)});
  });
  downloadFile("체온혈압기록_"+nowLogical().key+".csv","﻿"+rows.map(function(r){return r.map(csvCell).join(",")}).join("\r\n"),"text/csv");
  var msg=$("copy-msg");if(msg)msg.textContent="CSV 파일을 저장했어요.";
}

/* ---------- boot ---------- */
load();render();
// 시간이 지나면 측정 창이 바뀌므로 1분마다 화면만 다시 그립니다 (저장은 하지 않음)
setInterval(function(){if(!S.form){renderPhase();renderNow();renderToday()}},60000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!S.form){renderPhase();renderNow();renderToday();renderSummary()}});
if("serviceWorker" in navigator&&location.protocol!=="file:"){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}

// 테스트용 내부 접근 (화면에는 영향 없음)
window.__vitals={S:S,findNow:findNow,computeSummary:function(){return computeSummary(settings())},render:render,persist:persist};
})();
</script>
</body>
</html>
